[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
ambry-core = { path = "crates/ambry-core" }
ambry-macos = { path = "crates/ambry-macos" }
anyhow = "1"
async-channel = "2"
dirs = "6"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
